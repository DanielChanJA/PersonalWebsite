<VirtualHost *:443>
    ServerName danielchan.me
    ServerAlias www.danielchan.me

    DocumentRoot /var/www/danielchan.me/current
    DirectoryIndex index.html

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /etc/letsencrypt/live/danielchan.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/danielchan.me/privkey.pem

    <Directory /var/www/danielchan.me/current>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Files "_headers">
        Require all denied
    </Files>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate, no-transform"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/danielchan.me-error.log
    CustomLog ${APACHE_LOG_DIR}/danielchan.me-access.log combined
</VirtualHost>
